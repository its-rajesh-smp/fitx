# Non-secret configuration for the `prod` stack.
# Secrets are added with `pulumi config set --secret <key> <value>` (see README.md),
# which writes encrypted values into this file.
config:
  aws:region: ap-south-1
  aws:profile: repairs
  aws:defaultTags:
    tags:
      Project: fitx
      Environment: prod
      ManagedBy: pulumi
  # --- Custom domain (optional) ---
  # Without these the app is served on the default https://<id>.cloudfront.net URL.
  # Requires a public Route 53 hosted zone for hostedZoneName.
  # fitx:hostedZoneName: example.com
  # fitx:uiDomain: fitx.example.com

  # --- Network ---
  # none | single | onePerAz. "none" runs tasks in public subnets with a public IP (cheapest).
  fitx:natGateways: single
  # --- Database ---
  fitx:dbInstanceClass: db.t4g.micro
  fitx:dbAllocatedStorage: "20"
  fitx:dbMultiAz: "false"
  fitx:dbDeletionProtection: "true"
  # --- API service ---
  fitx:apiCpu: "512"
  fitx:apiMemory: "1024"
  fitx:apiMinCount: "1"
  fitx:apiMaxCount: "3"
  fitx:aiProvider: anthropic
  fitx:geminiModel: gemini-2.5-flash-lite
  fitx:openaiModel: gpt-4.1-mini
  fitx:openaiMemoryModel: gpt-4.1-mini
  # --- Public (non-secret) app settings ---
  fitx:googleClientId: ""
